name: Build and common regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      LINGXI_TEST_DEVICE: cpu
      BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          mkdir -p .tmp/ci
          {
            sw_vers
            xcodebuild -version
            swift --version
            xcrun metal --version
          } 2>&1 | tee .tmp/ci/toolchain.log
      - name: Release build
        run: swift build -c release --jobs 2 2>&1 | tee .tmp/ci/build.log
      - name: Common XCTest (no large model download)
        run: |
          mkdir -p .tmp/ci
          swift test list -c release --jobs 2 > .tmp/ci/tests.txt
          swift test -c release --jobs 2 --parallel --num-workers 1 --skip 'Hardware|TransformerLifetimeTests' --xunit-output .tmp/ci/tests.xml
          python3 Scripts/check-tests.py .tmp/ci/tests.txt .tmp/ci/tests.xml --cpu
      - name: Build and verify app bundle
        run: |
          Scripts/make-app.sh
          python3 Scripts/verify-app.py dist/LingXiStudio.app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: common-regression-evidence
          path: .tmp/ci/
          if-no-files-found: error
          include-hidden-files: true
